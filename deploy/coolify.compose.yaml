# Counterwell on Coolify (Docker Compose build pack). Coolify's proxy gives the api service its
# HTTPS domain, so there is no Caddy here; otherwise this matches deploy/compose.yaml. Coolify runs
# compose from the repository root, so build paths are relative to the root, not to deploy/.
# Environment (set in Coolify): DOMAIN, BUSINESS_ID, POSTGRES_PASSWORD, BETTER_AUTH_SECRET,
# OFFLINE_SIGNING_KEY, GATEWAY_TOKEN, OPENROUTER_API_KEY, OPENAI_API_KEY, the limits, and the
# notification keys APNS_KEY, APNS_KEY_ID, APNS_TEAM_ID and FCM_SERVICE_ACCOUNT, and optionally
# BACKUP_AGE_RECIPIENT (public key for the encrypted off-server backups).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: counterwell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: counterwell
    volumes:
      - counterwell-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterwell"]
      interval: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: "no"
    exclude_from_hc: true
    command: ["tsx", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://counterwell:${POSTGRES_PASSWORD}@postgres:5432/counterwell
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["tsx", "apps/api/src/index.ts"]
    # Time to finish requests in flight after SIGTERM (index.ts drains for up to 15 s).
    stop_grace_period: 20s
    environment:
      DATABASE_URL: postgres://counterwell:${POSTGRES_PASSWORD}@postgres:5432/counterwell
      PORT: "4100"
      NODE_ENV: production
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      TRUSTED_ORIGINS: counterwell://
      OFFLINE_SIGNING_KEY: ${OFFLINE_SIGNING_KEY}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      BUSINESS_ID: ${BUSINESS_ID}
      UPLOAD_DIR: /data/uploads
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      INVOICE_MONTHLY_LIMIT: ${INVOICE_MONTHLY_LIMIT:-100}
      VOICE_MONTHLY_LIMIT: ${VOICE_MONTHLY_LIMIT:-3000}
      # Phone notifications: Apple (APNs) for iPhones, Firebase (FCM) for Android.
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-com.counterwell.mobile}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      # The backups folder, read-only, so /health can report the newest backup's age and the shop
      # PC can fetch the encrypted ones. The api can never change or delete a backup.
      BACKUP_DIR: /backups
    volumes:
      - counterwell-uploads:/data/uploads
      - /data/counterwell/backups:/backups:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      # The proxy only routes to a healthy container: check every 2s while starting.
      start_period: 30s
      start_interval: 2s
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["tsx", "apps/api/src/worker.ts"]
    # An extraction call can take up to 60 s; let it finish rather than lose the attempt.
    stop_grace_period: 75s
    environment:
      DATABASE_URL: postgres://counterwell:${POSTGRES_PASSWORD}@postgres:5432/counterwell
      NODE_ENV: production
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OFFLINE_SIGNING_KEY: ${OFFLINE_SIGNING_KEY}
      UPLOAD_DIR: /data/uploads
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      INVOICE_MONTHLY_LIMIT: ${INVOICE_MONTHLY_LIMIT:-100}
      VOICE_MONTHLY_LIMIT: ${VOICE_MONTHLY_LIMIT:-3000}
    volumes:
      - counterwell-uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
  # A compressed dump every day, kept 30 days, in /data/counterwell/backups on the server. With
  # BACKUP_AGE_RECIPIENT (the owner's age public key, not a secret) each dump is also written
  # encrypted (.sql.gz.age) for the shop PC to copy; see docs/DEPLOY.md section 6.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - /data/counterwell/backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        # pipefail: a failed pg_dump must not leave a "successful" empty backup behind.
        set -o pipefail
        while true; do
          wait=86400
          f=/backups/counterwell-$$(date +%F-%H%M).sql.gz
          if pg_dump -h postgres -U counterwell -d counterwell --no-owner | gzip > "$$f.part"; then
            mv "$$f.part" "$$f"
            # Also write a copy only the owner's private key can open, for the shop PC to fetch.
            # The plain .sql.gz stays: anyone who can read this disk can already read the live
            # database, so encrypting it protects nothing here, and it restores without the key.
            if [ -n "$$BACKUP_AGE_RECIPIENT" ]; then
              command -v age >/dev/null || apk add --no-cache age >/dev/null 2>&1
              if age -r "$$BACKUP_AGE_RECIPIENT" -o "$$f.age.part" "$$f"; then
                mv "$$f.age.part" "$$f.age"
              else
                echo "backup: encrypting the dump failed" >&2
                find /backups -name '*.age.part' -delete
              fi
            fi
            find /backups -name 'counterwell-*.sql.gz*' -mtime +30 -delete
          else
            find /backups -name '*.sql.gz.part' -delete
            echo "backup: pg_dump failed, trying again in 30 minutes" >&2
            wait=1800
          fi
          sleep $$wait
        done
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  counterwell-pgdata:
  counterwell-uploads:

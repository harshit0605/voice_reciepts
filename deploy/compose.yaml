# The shop server: database, API, extraction worker, HTTPS and daily backups.
#   cp deploy/.env.example deploy/.env   (fill it in)
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
name: counterwell
x-server: &server
  build: { context: .., dockerfile: deploy/Dockerfile }
  image: counterwell-server
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://counterwell:${POSTGRES_PASSWORD}@postgres:5432/counterwell
    BETTER_AUTH_URL: https://${DOMAIN}
    TRUSTED_ORIGINS: counterwell://
    UPLOAD_DIR: /data/uploads
    PORT: "4100"
    BACKUP_DIR: /backups
  volumes: [uploads:/data/uploads]
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: counterwell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: counterwell
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterwell"]
      interval: 5s
      retries: 20
  migrate:
    <<: *server
    restart: "no"
    command: ["tsx", "packages/db/src/migrate.ts"]
    depends_on: { postgres: { condition: service_healthy } }
  api:
    <<: *server
    command: ["tsx", "apps/api/src/index.ts"]
    # The backups folder, read-only: /health reports the newest backup's age (BACKUP_DIR, set for
    # all services above) and the shop PC can fetch the encrypted ones. The api can never change
    # or delete a backup.
    volumes: [uploads:/data/uploads, "./backups:/backups:ro"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    <<: *server
    command: ["tsx", "apps/api/src/worker.ts"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in deploy/.env}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
  # A compressed dump every day, kept for 30 days, in deploy/backups on the server. With
  # BACKUP_AGE_RECIPIENT (the owner's age public key, in deploy/.env) each dump is also written
  # encrypted for the shop PC to copy: a backup on the same disk is not enough (docs/DEPLOY.md).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes: ["./backups:/backups"]
    entrypoint:
      - sh
      - -c
      - |
        # pipefail: a failed pg_dump must not leave a "successful" empty backup behind.
        set -o pipefail
        while true; do
          wait=86400
          f=/backups/counterwell-$$(date +%F-%H%M).sql.gz
          if pg_dump -h postgres -U counterwell -d counterwell --no-owner | gzip > "$$f.part"; then
            mv "$$f.part" "$$f"
            # Also write a copy only the owner's private key can open, for the shop PC to fetch.
            # The plain .sql.gz stays: anyone who can read this disk can already read the live
            # database, so encrypting it protects nothing here, and it restores without the key.
            if [ -n "$$BACKUP_AGE_RECIPIENT" ]; then
              command -v age >/dev/null || apk add --no-cache age >/dev/null 2>&1
              if age -r "$$BACKUP_AGE_RECIPIENT" -o "$$f.age.part" "$$f"; then
                mv "$$f.age.part" "$$f.age"
              else
                echo "backup: encrypting the dump failed" >&2
                find /backups -name '*.age.part' -delete
              fi
            fi
            find /backups -name 'counterwell-*.sql.gz*' -mtime +30 -delete
          else
            find /backups -name '*.sql.gz.part' -delete
            echo "backup: pg_dump failed, trying again in 30 minutes" >&2
            wait=1800
          fi
          sleep $$wait
        done
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

name: Uptime
# Checks the production server from outside every 30 minutes. If the check fails, this run fails,
# and GitHub emails the person who last changed the schedule below (the repository owner) about a
# failed scheduled run, which is the down alert. Make sure Actions email notifications are on
# (GitHub -> Settings -> Notifications -> Actions). Note: GitHub pauses scheduled workflows in a
# repository with no activity for 60 days; a push or a manual run (Actions -> Uptime -> Run
# workflow) starts them again.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Server answers, and the newest backup is recent
        env:
          # Set the repository variable HEALTH_URL (Settings -> Secrets and variables -> Actions
          # -> Variables) to change the address; this default is already public in docs/DEPLOY.md.
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://counterwell.72.62.241.119.sslip.io/health' }}
          MAX_BACKUP_AGE_HOURS: "26"
        run: |
          # A few tries first: one dropped connection or a restart during a deploy is not an outage.
          body=""
          for attempt in 1 2 3; do
            if body=$(curl --silent --show-error --fail --max-time 20 "$HEALTH_URL") \
              && echo "$body" | jq -e '.ok == true' >/dev/null; then
              break
            fi
            body=""
            echo "Attempt $attempt did not get an ok answer."
            [ "$attempt" -lt 3 ] && sleep 20
          done
          if [ -z "$body" ]; then
            echo "::error::The server did not answer ok at $HEALTH_URL after 3 tries."
            exit 1
          fi
          echo "Server is up."
          # backupAgeHours is the age of the newest database backup. Missing or null means the
          # backups folder is not mounted or empty, which is also a problem worth an email.
          if ! echo "$body" | jq -e '(.backupAgeHours | type) == "number"' >/dev/null; then
            echo "::error::/health has no backup age: the backups folder is missing or empty."
            exit 1
          fi
          age=$(echo "$body" | jq -r '.backupAgeHours')
          echo "Newest backup is $age hours old (limit $MAX_BACKUP_AGE_HOURS)."
          if ! echo "$body" | jq -e --argjson max "$MAX_BACKUP_AGE_HOURS" '.backupAgeHours <= $max' >/dev/null; then
            echo "::error::The newest backup is $age hours old, over the $MAX_BACKUP_AGE_HOURS hour limit."
            exit 1
          fi

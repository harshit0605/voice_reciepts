name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: counterwell
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: counterwell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U counterwell"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://counterwell:test_only_password@localhost:5432/counterwell_test
      - run: npm run test:camera
      - run: npm run build:web
